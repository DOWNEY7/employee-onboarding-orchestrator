[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "employee-onboarding-orchestrator"
version = "0.1.0"
description = "Multi-agent LangGraph workflow for IT employee onboarding and offboarding"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core LangGraph + LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # Azure OpenAI
    "openai>=1.40.0",
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Pydantic v2
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Templating
    "jinja2>=3.1.4",
    # Persistence
    "langgraph-checkpoint-sqlite>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    # Security & OAuth2
    "pyjwt>=2.9.0",
    # Observability & Metrics
    "prometheus-client>=0.20.0",
    # ZIP generation
    "zipfile36>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",      # for FastAPI test client
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["agents", "graph", "models", "api"]
