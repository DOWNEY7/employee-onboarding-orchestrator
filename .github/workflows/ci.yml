name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  # LLM set to openai so CI doesn't need Azure creds; tests mock LLM calls
  LLM_PROVIDER: "openai"
  OPENAI_API_KEY: "sk-test-placeholder"   # real tests don't call the LLM
  # API key used by the integration tests in test_api.py
  API_KEY: "test-ci-api-key-do-not-use-in-production"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --cov=agents --cov=models --cov=graph --cov=api \
            --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          API_KEY: ${{ env.API_KEY }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  validate-ps-templates:
    name: Validate PowerShell template rendering
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Jinja2
        run: pip install jinja2

      - name: Validate all PS templates render cleanly
        run: |
          python - <<'EOF'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, StrictUndefined

          templates_dir = Path("scripts/templates")
          env = Environment(
              loader=FileSystemLoader(str(templates_dir)),
              undefined=StrictUndefined,
              autoescape=False,
          )

          # Minimal context that covers all template variables
          context = {
              "first_name": "Jane",
              "last_name": "Smith",
              "display_name": "Jane Smith",
              "role": "Software Engineer",
              "department": "Engineering",
              "start_date": "2025-09-01",
              "email_prefix": "jane.smith",
              "domain": "contoso.com",
              "upn": "jane.smith@contoso.com",
              "licence_sku": "E3",
              "location": "UK",
              "groups": [
                  {"name": "Engineering-All", "id": "00000000-0000-0000-0000-000000000001"},
              ],
              "generated_at": "2025-09-01T00:00:00Z",
              # Leaver fields
              "email": "john.doe@contoso.com",
              "last_working_day": "2025-09-30",
              "reason": "Resignation",
              "data_transfer_recipient": "manager@contoso.com",
              "hardware_return_required": True,
          }

          failed = []
          for template_file in templates_dir.glob("*.ps1.j2"):
              try:
                  tmpl = env.get_template(template_file.name)
                  rendered = tmpl.render(**context)
                  print(f"  ✅ {template_file.name} ({len(rendered)} chars)")
              except Exception as e:
                  print(f"  ❌ {template_file.name}: {e}")
                  failed.append(template_file.name)

          if failed:
              print(f"\nFAILED: {failed}")
              raise SystemExit(1)

          print("\nAll templates rendered successfully.")
          EOF

  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t onboarding-orchestrator:ci .

      - name: Verify image starts and /health responds
        run: |
          docker run --rm -d \
            --name onboarding-ci \
            -p 8000:8000 \
            -e LLM_PROVIDER=openai \
            -e OPENAI_API_KEY=sk-test \
            -e API_KEY=ci-test-key \
            -e DATABASE_URL="sqlite:////tmp/ci.db" \
            onboarding-orchestrator:ci
          # Wait for startup (max 30s)
          for i in $(seq 1 10); do
            sleep 3
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for startup ($i/10)..."
          done
          docker stop onboarding-ci
